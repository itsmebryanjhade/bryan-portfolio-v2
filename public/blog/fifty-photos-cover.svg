<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0" stop-color="#2b2420"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </radialGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a96b"/><stop offset="1" stop-color="#d9607a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f0"/><stop offset="1" stop-color="#3f7fc4"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9a1"/><stop offset="1" stop-color="#5aa36b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- a fanned stack of framed event photos -->
  <g transform="translate(800 520)">
    <g transform="rotate(-18) translate(-560 -230)" filter="url(#shadow)">
      <rect width="360" height="460" rx="10" fill="#f4f1ec"/><rect x="24" y="24" width="312" height="340" fill="url(#leaf)"/>
      <path d="M24 364 L120 250 L200 320 L260 270 L336 364 Z" fill="#2f6b45" opacity="0.7"/>
    </g>
    <g transform="rotate(-8) translate(-380 -250)" filter="url(#shadow)">
      <rect width="360" height="460" rx="10" fill="#f4f1ec"/><rect x="24" y="24" width="312" height="340" fill="url(#sea)"/>
      <circle cx="250" cy="110" r="38" fill="#fff6d6"/>
      <path d="M24 300 Q110 270 180 300 T336 300 L336 364 L24 364 Z" fill="#2d5f99"/>
    </g>
    <g transform="rotate(6) translate(10 -250)" filter="url(#shadow)">
      <rect width="360" height="460" rx="10" fill="#f4f1ec"/><rect x="24" y="24" width="312" height="340" fill="#cdb7e8"/>
      <circle cx="120" cy="190" r="42" fill="#7a5aa8"/><path d="M60 364 Q120 240 180 364 Z" fill="#7a5aa8"/>
      <circle cx="240" cy="200" r="36" fill="#9878c4"/><path d="M188 364 Q240 260 292 364 Z" fill="#9878c4"/>
    </g>
    <g transform="rotate(-1) translate(-190 -270)" filter="url(#shadow)">
      <rect width="380" height="490" rx="10" fill="#fbfaf7"/><rect x="26" y="26" width="328" height="360" fill="url(#dusk)"/>
      <circle cx="190" cy="250" r="70" fill="#ffe2a8"/>
      <path d="M26 386 L130 280 L210 340 L280 290 L354 386 Z" fill="#7a2f4f" opacity="0.85"/>
      <rect x="120" y="420" width="140" height="12" rx="6" fill="#d8d3ca"/><rect x="150" y="444" width="80" height="10" rx="5" fill="#e6e2da"/>
    </g>
  </g>

  <!-- the ZIP they end up in -->
  <g transform="translate(1210 640) rotate(8)" filter="url(#shadow)">
    <rect width="190" height="230" rx="18" fill="#f2c45a"/>
    <path d="M140 0 L190 50 L140 50 Z" fill="#c99a32"/>
    <g fill="#8a6a1e">
      <rect x="84" y="0" width="22" height="16"/><rect x="84" y="32" width="22" height="16"/><rect x="84" y="64" width="22" height="16"/><rect x="84" y="96" width="22" height="16"/>
      <rect x="74" y="122" width="42" height="56" rx="8"/>
    </g>
    <rect x="86" y="140" width="18" height="22" rx="4" fill="#f2c45a"/>
  </g>
</svg>
