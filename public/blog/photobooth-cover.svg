<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="38%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#0f0b0d"/>
    </radialGradient>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe6a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1180" cy="250" r="360" fill="url(#flash)"/>

  <!-- a four-frame photostrip -->
  <g transform="translate(560 -40) rotate(-9)" filter="url(#shadow)">
    <rect width="340" height="1080" rx="8" fill="#fbf8f2"/>
    <g>
      <rect x="22" y="22" width="296" height="230" fill="#f3b8c8"/>
      <circle cx="120" cy="120" r="40" fill="#6d3550"/><path d="M60 252 Q120 160 180 252 Z" fill="#6d3550"/>
      <circle cx="220" cy="130" r="36" fill="#8c4a68"/><path d="M168 252 Q220 172 272 252 Z" fill="#8c4a68"/>
    </g>
    <g transform="translate(0 252)">
      <rect x="22" y="22" width="296" height="230" fill="#b9d8f2"/>
      <circle cx="160" cy="118" r="44" fill="#2f5a84"/><path d="M90 252 Q160 150 230 252 Z" fill="#2f5a84"/>
      <rect x="196" y="70" width="44" height="30" rx="6" fill="#f2c45a" transform="rotate(14 218 85)"/>
    </g>
    <g transform="translate(0 504)">
      <rect x="22" y="22" width="296" height="230" fill="#f6d9a6"/>
      <circle cx="104" cy="126" r="36" fill="#8a5a2b"/><path d="M56 252 Q104 176 152 252 Z" fill="#8a5a2b"/>
      <circle cx="172" cy="116" r="40" fill="#a86e36"/><path d="M118 252 Q172 164 226 252 Z" fill="#a86e36"/>
      <circle cx="244" cy="130" r="32" fill="#c4874a"/><path d="M204 252 Q244 186 284 252 Z" fill="#c4874a"/>
    </g>
    <g transform="translate(0 756)">
      <rect x="22" y="22" width="296" height="230" fill="#c9e8c4"/>
      <circle cx="160" cy="124" r="42" fill="#3c7046"/><path d="M92 252 Q160 156 228 252 Z" fill="#3c7046"/>
      <path d="M96 70 l10 22 l24 2 l-18 16 l6 24 l-22 -12 l-22 12 l6 -24 l-18 -16 l24 -2 z" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>

  <!-- the booth camera -->
  <g transform="translate(1000 520) rotate(6)" filter="url(#shadow)">
    <rect width="380" height="250" rx="34" fill="#1e1f24" stroke="#3a3c44" stroke-width="3"/>
    <rect x="40" y="-34" width="110" height="46" rx="12" fill="#26272d"/>
    <circle cx="200" cy="130" r="86" fill="#0d0e12" stroke="#4a4d57" stroke-width="10"/>
    <circle cx="200" cy="130" r="50" fill="#1b2a44"/>
    <circle cx="180" cy="110" r="14" fill="#9cc2f5" opacity="0.8"/>
    <rect x="300" y="30" width="50" height="30" rx="8" fill="#fff4cf"/>
    <circle cx="70" cy="70" r="12" fill="#f0716b"/>
  </g>
</svg>
